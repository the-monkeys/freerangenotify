components:
    schemas:
        CreateTemplateRequest:
            properties:
                app_id:
                    type: string
                body:
                    type: string
                channel:
                    enum:
                        - push
                        - email
                        - sms
                        - webhook
                        - in_app
                        - sse
                        - slack
                        - discord
                        - whatsapp
                    type: string
                created_by:
                    type: string
                description:
                    type: string
                locale:
                    maxLength: 10
                    minLength: 2
                    type: string
                metadata:
                    additionalProperties: true
                    type: object
                name:
                    maxLength: 100
                    minLength: 3
                    type: string
                subject:
                    type: string
                variables:
                    items:
                        type: string
                    type: array
                webhook_target:
                    type: string
            required:
                - app_id
                - body
                - channel
                - name
            type: object
        CreateVersionRequest:
            properties:
                body:
                    type: string
                created_by:
                    type: string
                description:
                    type: string
                locale:
                    maxLength: 10
                    minLength: 2
                    type: string
                metadata:
                    additionalProperties: true
                    type: object
                subject:
                    type: string
                variables:
                    items:
                        type: string
                    type: array
            required:
                - body
            type: object
        ListTemplatesResponse:
            properties:
                limit:
                    type: integer
                offset:
                    type: integer
                templates:
                    items:
                        $ref: '#/components/schemas/TemplateResponse'
                    type: array
                total:
                    type: integer
            type: object
        RenderTemplateRequest:
            properties:
                data:
                    additionalProperties: true
                    type: object
                editable:
                    type: boolean
            required:
                - data
            type: object
        RenderTemplateResponse:
            properties:
                attribute_variables:
                    items:
                        $ref: '#/components/schemas/template.AttributeVar'
                    type: array
                rendered_body:
                    type: string
            type: object
        RollbackRequest:
            properties:
                target_version:
                    minimum: 1
                    type: integer
                updated_by:
                    type: string
                version:
                    minimum: 1
                    type: integer
            type: object
        SendTestRequest:
            properties:
                sample_data:
                    additionalProperties: true
                    type: object
                to_email:
                    type: string
            required:
                - to_email
            type: object
        TemplateResponse:
            properties:
                app_id:
                    type: string
                body:
                    type: string
                channel:
                    type: string
                control_values:
                    $ref: '#/components/schemas/template.ControlValues'
                controls:
                    items:
                        $ref: '#/components/schemas/template.TemplateControl'
                    type: array
                created_at:
                    type: string
                created_by:
                    type: string
                description:
                    type: string
                id:
                    type: string
                locale:
                    type: string
                metadata:
                    additionalProperties: true
                    type: object
                name:
                    type: string
                status:
                    type: string
                subject:
                    type: string
                updated_at:
                    type: string
                updated_by:
                    type: string
                variables:
                    items:
                        type: string
                    type: array
                version:
                    type: integer
                webhook_target:
                    type: string
            type: object
        UpdateTemplateRequest:
            properties:
                body:
                    type: string
                description:
                    type: string
                locale:
                    maxLength: 10
                    minLength: 2
                    type: string
                metadata:
                    additionalProperties: true
                    type: object
                status:
                    enum:
                        - active
                        - inactive
                        - archived
                    type: string
                subject:
                    type: string
                updated_by:
                    type: string
                variables:
                    items:
                        type: string
                    type: array
                webhook_target:
                    type: string
            type: object
        application.CustomProviderConfig:
            properties:
                active:
                    type: boolean
                channel:
                    type: string
                created_at:
                    type: string
                headers:
                    additionalProperties:
                        type: string
                    type: object
                kind:
                    type: string
                name:
                    type: string
                provider_id:
                    type: string
                signature_version:
                    type: string
                signing_key:
                    type: string
                webhook_url:
                    type: string
            type: object
        application.DefaultPreferences:
            properties:
                discord_enabled:
                    description: Phase 3
                    type: boolean
                email_enabled:
                    type: boolean
                push_enabled:
                    type: boolean
                slack_enabled:
                    description: Phase 3
                    type: boolean
                sms_enabled:
                    type: boolean
                whatsapp_enabled:
                    description: Phase 3
                    type: boolean
            type: object
        application.DiscordAppConfig:
            properties:
                webhook_url:
                    type: string
            type: object
        application.EmailConfig:
            properties:
                provider_type:
                    description: '"smtp", "sendgrid", "system"'
                    type: string
                sendgrid:
                    $ref: '#/components/schemas/application.SendGridConfig'
                smtp:
                    $ref: '#/components/schemas/application.SMTPConfig'
            type: object
        application.InboundWebhookConfig:
            properties:
                event_mapping:
                    additionalProperties:
                        type: string
                    description: event name -> workflow trigger_id
                    type: object
                secret:
                    type: string
            type: object
        application.ProviderFallback:
            properties:
                channel:
                    description: e.g. "email", "push", "sms"
                    type: string
                providers:
                    description: 'Ordered: ["sendgrid", "smtp"]'
                    items:
                        type: string
                    type: array
            type: object
        application.SMSAppConfig:
            properties:
                account_sid:
                    type: string
                auth_token:
                    type: string
                from_number:
                    type: string
            type: object
        application.SMTPConfig:
            properties:
                from_email:
                    type: string
                from_name:
                    type: string
                host:
                    type: string
                password:
                    type: string
                port:
                    type: integer
                username:
                    type: string
            type: object
        application.SendGridConfig:
            properties:
                api_key:
                    type: string
                from_email:
                    type: string
                from_name:
                    type: string
            type: object
        application.Settings:
            properties:
                custom_providers:
                    description: Phase 3
                    items:
                        $ref: '#/components/schemas/application.CustomProviderConfig'
                    type: array
                daily_email_limit:
                    type: integer
                default_preferences:
                    $ref: '#/components/schemas/application.DefaultPreferences'
                default_template:
                    description: default template ID
                    type: string
                discord:
                    allOf:
                        - $ref: '#/components/schemas/application.DiscordAppConfig'
                    description: Phase 3
                email_config:
                    $ref: '#/components/schemas/application.EmailConfig'
                enable_analytics:
                    description: analytics tracking
                    type: boolean
                enable_webhooks:
                    description: webhook notifications
                    type: boolean
                inbound_webhook_config:
                    allOf:
                        - $ref: '#/components/schemas/application.InboundWebhookConfig'
                    description: 'Phase 7: inbound webhook config (secret, event mapping)'
                on_user_created_trigger_id:
                    description: 'Phase 5: workflow to trigger on user create'
                    type: string
                provider_fallbacks:
                    items:
                        $ref: '#/components/schemas/application.ProviderFallback'
                    type: array
                rate_limit:
                    description: requests per hour
                    type: integer
                retry_attempts:
                    description: max retry attempts
                    type: integer
                slack:
                    allOf:
                        - $ref: '#/components/schemas/application.SlackAppConfig'
                    description: Phase 3
                sms_config:
                    allOf:
                        - $ref: '#/components/schemas/application.SMSAppConfig'
                    description: 'Billing: per-app SMS creds'
                subscriber_throttle:
                    additionalProperties:
                        $ref: '#/components/schemas/application.SubscriberThrottleConfig'
                    description: Phase 2
                    type: object
                validation_config:
                    $ref: '#/components/schemas/application.ValidationConfig'
                validation_url:
                    type: string
                whatsapp_config:
                    allOf:
                        - $ref: '#/components/schemas/application.WhatsAppAppConfig'
                    description: Phase 3
                whatsapp_inbound:
                    allOf:
                        - $ref: '#/components/schemas/whatsapp.InboundConfig'
                    description: WhatsApp Meta inbound config
            type: object
        application.SlackAppConfig:
            properties:
                bot_token:
                    type: string
                webhook_url:
                    type: string
            type: object
        application.SubscriberThrottleConfig:
            properties:
                max_per_day:
                    type: integer
                max_per_hour:
                    type: integer
            type: object
        application.ValidationConfig:
            properties:
                method:
                    description: GET, POST
                    type: string
                static_headers:
                    additionalProperties:
                        type: string
                    type: object
                token_key:
                    description: e.g. "Authorization", "access_token"
                    type: string
                token_placement:
                    description: header, cookie, query, body_json, body_form
                    type: string
            type: object
        application.WhatsAppAppConfig:
            properties:
                account_sid:
                    description: Twilio fields (used when Provider == "" or "twilio")
                    type: string
                auth_token:
                    type: string
                connected_at:
                    type: string
                connection_status:
                    description: connected, disconnected, pending
                    type: string
                display_phone_number:
                    type: string
                from_number:
                    type: string
                meta_access_token:
                    type: string
                meta_app_secret:
                    type: string
                meta_business_id:
                    description: Embedded Signup metadata (populated during OAuth connect flow)
                    type: string
                meta_phone_number_id:
                    description: Meta Cloud API fields (used when Provider == "meta")
                    type: string
                meta_waba_id:
                    type: string
                provider:
                    description: '"twilio" (default) or "meta"'
                    type: string
                quality_rating:
                    type: string
            type: object
        auth.InviteMemberRequest:
            properties:
                email:
                    type: string
                role:
                    $ref: '#/components/schemas/auth.Role'
            required:
                - email
                - role
            type: object
        auth.Role:
            enum:
                - owner
                - admin
                - editor
                - viewer
            type: string
            x-enum-varnames:
                - RoleOwner
                - RoleAdmin
                - RoleEditor
                - RoleViewer
        auth.UpdateMemberRoleRequest:
            properties:
                role:
                    $ref: '#/components/schemas/auth.Role'
            required:
                - role
            type: object
        billing.PaymentVerification:
            properties:
                razorpay_order_id:
                    type: string
                razorpay_payment_id:
                    type: string
                razorpay_signature:
                    type: string
            required:
                - razorpay_order_id
                - razorpay_payment_id
                - razorpay_signature
            type: object
        billing.PlanBundle:
            properties:
                active:
                    type: boolean
                amount_paisa:
                    type: integer
                credits_included:
                    type: integer
                currency:
                    type: string
                display_order:
                    type: integer
                id:
                    type: string
                metadata:
                    additionalProperties: true
                    type: object
                name:
                    type: string
                validity_days:
                    type: integer
            type: object
        bizbilling.AdjustBalanceRequest:
            properties:
                amount_paisa:
                    type: integer
                reason:
                    type: string
            required:
                - amount_paisa
            type: object
        bizbilling.AmendContractRequest:
            properties:
                description:
                    type: string
                effective_date:
                    type: string
            required:
                - description
                - effective_date
            type: object
        bizbilling.ApplyCouponRequest:
            properties:
                code:
                    type: string
            required:
                - code
            type: object
        bizbilling.BillingCycle:
            enum:
                - weekly
                - monthly
                - quarterly
                - half_yearly
                - yearly
                - custom
            type: string
            x-enum-comments:
                BillingCycleCustom: Uses CycleDays field
            x-enum-descriptions:
                - ""
                - ""
                - ""
                - ""
                - ""
                - Uses CycleDays field
            x-enum-varnames:
                - BillingCycleWeekly
                - BillingCycleMonthly
                - BillingCycleQuarterly
                - BillingCycleHalfYearly
                - BillingCycleYearly
                - BillingCycleCustom
        bizbilling.BulkGenerateCouponsRequest:
            properties:
                count:
                    maximum: 1000
                    minimum: 1
                    type: integer
                prefix:
                    type: string
                rules:
                    $ref: '#/components/schemas/bizbilling.CreateCouponRequest'
            required:
                - count
                - rules
            type: object
        bizbilling.CreateConnectorRequest:
            properties:
                app_id:
                    type: string
                event_mappings:
                    additionalProperties: true
                    type: object
                provider:
                    type: string
                webhook_secret:
                    type: string
            required:
                - app_id
                - provider
            type: object
        bizbilling.CreateContractRequest:
            properties:
                auto_renew:
                    type: boolean
                end_date:
                    type: string
                metadata:
                    additionalProperties: true
                    type: object
                start_date:
                    type: string
                subscription_id:
                    type: string
                terms:
                    type: string
                user_id:
                    type: string
                value_paisa:
                    type: integer
            required:
                - end_date
                - start_date
                - user_id
            type: object
        bizbilling.CreateCouponRequest:
            properties:
                applicable_plan_ids:
                    items:
                        type: string
                    type: array
                code:
                    type: string
                discount_type:
                    $ref: '#/components/schemas/bizbilling.DiscountType'
                discount_value:
                    type: integer
                max_uses:
                    type: integer
                max_uses_per_user:
                    type: integer
                stackable:
                    type: boolean
                valid_from:
                    type: string
                valid_until:
                    type: string
            required:
                - code
                - discount_type
                - discount_value
            type: object
        bizbilling.CreateCreditNoteRequest:
            properties:
                amount_paisa:
                    type: integer
                invoice_id:
                    type: string
                reason:
                    type: string
                user_id:
                    type: string
            required:
                - amount_paisa
                - user_id
            type: object
        bizbilling.CreateEstimateRequest:
            properties:
                currency:
                    type: string
                line_items:
                    items:
                        $ref: '#/components/schemas/bizbilling.InvoiceLineItem'
                    minItems: 1
                    type: array
                metadata:
                    additionalProperties: true
                    type: object
                notes:
                    type: string
                terms:
                    type: string
                user_id:
                    type: string
                valid_until:
                    type: string
            required:
                - line_items
                - user_id
            type: object
        bizbilling.CreateExpenseRequest:
            properties:
                amount_paisa:
                    type: integer
                billable:
                    type: boolean
                billed_to_user:
                    type: string
                category:
                    type: string
                date:
                    description: defaults to now
                    type: string
                description:
                    type: string
                metadata:
                    additionalProperties: true
                    type: object
                receipt_file_id:
                    type: string
                recurrence_cycle:
                    type: string
                recurring:
                    type: boolean
                vendor:
                    type: string
            required:
                - amount_paisa
                - category
            type: object
        bizbilling.CreateInvoiceRequest:
            properties:
                currency:
                    type: string
                line_items:
                    items:
                        $ref: '#/components/schemas/bizbilling.InvoiceLineItem'
                    minItems: 1
                    type: array
                metadata:
                    additionalProperties: true
                    type: object
                notes:
                    type: string
                payment_terms:
                    type: string
                user_id:
                    type: string
            required:
                - currency
                - line_items
                - user_id
            type: object
        bizbilling.CreatePlanAddonRequest:
            properties:
                amount_paisa:
                    minimum: 1
                    type: integer
                billing_cycle:
                    allOf:
                        - $ref: '#/components/schemas/bizbilling.BillingCycle'
                    description: Defaults to parent plan's cycle
                name:
                    maxLength: 255
                    minLength: 1
                    type: string
            required:
                - amount_paisa
                - name
            type: object
        bizbilling.CreatePlanRequest:
            properties:
                amount_paisa:
                    minimum: 0
                    type: integer
                billing_cycle:
                    $ref: '#/components/schemas/bizbilling.BillingCycle'
                currency:
                    description: Defaults to "INR"
                    type: string
                cycle_days:
                    minimum: 0
                    type: integer
                metadata:
                    additionalProperties: true
                    type: object
                name:
                    maxLength: 255
                    minLength: 1
                    type: string
                pricing_model:
                    allOf:
                        - $ref: '#/components/schemas/bizbilling.PricingModel'
                    description: Defaults to "flat"
                product_id:
                    type: string
                setup_fee_paisa:
                    minimum: 0
                    type: integer
                tax_inclusive:
                    type: boolean
                tiers:
                    items:
                        $ref: '#/components/schemas/bizbilling.PricingTier'
                    type: array
                trial_days:
                    maximum: 365
                    minimum: 0
                    type: integer
            required:
                - billing_cycle
                - name
                - product_id
            type: object
        bizbilling.CreateProductRequest:
            properties:
                description:
                    maxLength: 1000
                    type: string
                hsn_code:
                    maxLength: 8
                    type: string
                metadata:
                    additionalProperties: true
                    type: object
                name:
                    maxLength: 255
                    minLength: 1
                    type: string
                tax_rate:
                    maximum: 28
                    minimum: 0
                    type: integer
                unit:
                    maxLength: 50
                    type: string
            required:
                - name
            type: object
        bizbilling.CreateRetainerRequest:
            properties:
                amount_paisa:
                    type: integer
                notes:
                    type: string
                user_id:
                    type: string
            required:
                - amount_paisa
                - user_id
            type: object
        bizbilling.CreateSubscriptionRequest:
            properties:
                addon_ids:
                    items:
                        type: string
                    type: array
                metadata:
                    additionalProperties: true
                    type: object
                plan_id:
                    type: string
                quantity:
                    minimum: 1
                    type: integer
                trial_days:
                    type: integer
                user_id:
                    type: string
            required:
                - plan_id
                - user_id
            type: object
        bizbilling.CreateUsageMeterRequest:
            properties:
                aggregation:
                    description: defaults to sum
                    type: string
                name:
                    type: string
                unit:
                    type: string
            required:
                - name
            type: object
        bizbilling.DiscountType:
            enum:
                - percentage
                - fixed
            type: string
            x-enum-comments:
                DiscountTypeFixed: DiscountValue = paisa
                DiscountTypePercentage: DiscountValue = percent (e.g. 10 for 10%)
            x-enum-descriptions:
                - DiscountValue = percent (e.g. 10 for 10%)
                - DiscountValue = paisa
            x-enum-varnames:
                - DiscountTypePercentage
                - DiscountTypeFixed
        bizbilling.InvoiceLineItem:
            properties:
                amount_paisa:
                    description: (Quantity * UnitPrice) - Discount
                    type: integer
                description:
                    type: string
                discount_paisa:
                    type: integer
                hsn_code:
                    type: string
                quantity:
                    type: integer
                tax_rate:
                    description: e.g., 18 for 18%
                    type: integer
                unit_price:
                    description: in paisa
                    type: integer
            type: object
        bizbilling.PricingModel:
            enum:
                - flat
                - per_unit
                - tiered
                - volume
            type: string
            x-enum-comments:
                PricingModelFlat: Fixed price per cycle
                PricingModelPerUnit: Price × quantity (e.g., per seat)
                PricingModelTiered: Different price per tier (all units in each tier)
                PricingModelVolume: Single price based on total volume
            x-enum-descriptions:
                - Fixed price per cycle
                - Price × quantity (e.g., per seat)
                - Different price per tier (all units in each tier)
                - Single price based on total volume
            x-enum-varnames:
                - PricingModelFlat
                - PricingModelPerUnit
                - PricingModelTiered
                - PricingModelVolume
        bizbilling.PricingTier:
            properties:
                flat_paisa:
                    description: Optional flat fee for this tier
                    type: integer
                unit_paisa:
                    description: Price per unit in paisa
                    type: integer
                up_to:
                    description: Upper bound of this tier (0 = unlimited / last tier)
                    type: integer
            type: object
        bizbilling.RecordPaymentRequest:
            properties:
                amount_paisa:
                    minimum: 0
                    type: integer
                gateway_txn_id:
                    type: string
                method:
                    description: cash | bank_transfer | cheque | card | upi | gateway
                    type: string
                notes:
                    type: string
                tds_paisa:
                    minimum: 0
                    type: integer
            required:
                - method
            type: object
        bizbilling.RefundPaymentRequest:
            properties:
                amount_paisa:
                    minimum: 0
                    type: integer
                reason:
                    type: string
            type: object
        bizbilling.ReportUsageEvent:
            properties:
                meter_id:
                    type: string
                quantity:
                    type: integer
                subscription_id:
                    type: string
                timestamp:
                    description: defaults to now
                    type: string
                user_id:
                    type: string
            required:
                - meter_id
                - quantity
                - user_id
            type: object
        bizbilling.ReportUsageRequest:
            properties:
                events:
                    items:
                        $ref: '#/components/schemas/bizbilling.ReportUsageEvent'
                    maxItems: 500
                    minItems: 1
                    type: array
            required:
                - events
            type: object
        bizbilling.UpdateConnectorRequest:
            properties:
                active:
                    type: boolean
                event_mappings:
                    additionalProperties: true
                    type: object
                webhook_secret:
                    type: string
            type: object
        bizbilling.UpdateContractRequest:
            properties:
                auto_renew:
                    type: boolean
                end_date:
                    type: string
                start_date:
                    type: string
                terms:
                    type: string
                value_paisa:
                    type: integer
            type: object
        bizbilling.UpdateCouponRequest:
            properties:
                active:
                    type: boolean
                applicable_plan_ids:
                    items:
                        type: string
                    type: array
                discount_value:
                    type: integer
                max_uses:
                    type: integer
                max_uses_per_user:
                    type: integer
                stackable:
                    type: boolean
                valid_from:
                    type: string
                valid_until:
                    type: string
            type: object
        bizbilling.UpdateEstimateRequest:
            properties:
                line_items:
                    items:
                        $ref: '#/components/schemas/bizbilling.InvoiceLineItem'
                    type: array
                metadata:
                    additionalProperties: true
                    type: object
                notes:
                    type: string
                terms:
                    type: string
                valid_until:
                    type: string
            type: object
        bizbilling.UpdateExpenseRequest:
            properties:
                amount_paisa:
                    type: integer
                billable:
                    type: boolean
                billed_to_user:
                    type: string
                category:
                    type: string
                date:
                    type: string
                description:
                    type: string
                receipt_file_id:
                    type: string
                vendor:
                    type: string
            type: object
        bizbilling.UpdateInvoiceRequest:
            properties:
                line_items:
                    items:
                        $ref: '#/components/schemas/bizbilling.InvoiceLineItem'
                    type: array
                metadata:
                    additionalProperties: true
                    type: object
                notes:
                    type: string
                payment_terms:
                    type: string
            type: object
        bizbilling.UpdatePlanRequest:
            properties:
                active:
                    type: boolean
                amount_paisa:
                    minimum: 0
                    type: integer
                billing_cycle:
                    $ref: '#/components/schemas/bizbilling.BillingCycle'
                currency:
                    type: string
                cycle_days:
                    minimum: 0
                    type: integer
                metadata:
                    additionalProperties: true
                    type: object
                name:
                    maxLength: 255
                    minLength: 1
                    type: string
                pricing_model:
                    $ref: '#/components/schemas/bizbilling.PricingModel'
                setup_fee_paisa:
                    minimum: 0
                    type: integer
                tax_inclusive:
                    type: boolean
                tiers:
                    items:
                        $ref: '#/components/schemas/bizbilling.PricingTier'
                    type: array
                trial_days:
                    maximum: 365
                    minimum: 0
                    type: integer
            type: object
        bizbilling.UpdateProductRequest:
            properties:
                active:
                    type: boolean
                description:
                    maxLength: 1000
                    type: string
                hsn_code:
                    maxLength: 8
                    type: string
                metadata:
                    additionalProperties: true
                    type: object
                name:
                    maxLength: 255
                    minLength: 1
                    type: string
                tax_rate:
                    maximum: 28
