openapi: 3.0.3
paths:
    /v1/otp/resend:
        post:
            description: Re-issues a new code for an existing request_id (subject to 60s cooldown). The previous code is invalidated and attempt counter is reset.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/dto.OTPResendRequest'
                description: OTP resend request
                required: true
                x-originalParamName: body
            responses:
                "202":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/dto.OTPSendResponse'
                    description: Accepted
                "400":
                    content:
                        application/json:
                            schema:
                                additionalProperties: true
                                type: object
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                additionalProperties: true
                                type: object
                    description: Unauthorized
                "404":
                    content:
                        application/json:
                            schema:
                                additionalProperties: true
                                type: object
                    description: Not Found
                "409":
                    content:
                        application/json:
                            schema:
                                additionalProperties: true
                                type: object
                    description: Conflict
                "429":
                    content:
                        application/json:
                            schema:
                                additionalProperties: true
                                type: object
                    description: Too Many Requests
            security:
                - ApiKeyAuth: []
                - BearerAuth: []
            summary: Resend an OTP
            tags:
                - OTP
            x-contract-example:
                request:
                    request_id: ${OTP_REQUEST_ID}
                response:
                    error: 'otp: resend cooldown in effect'
            x-feature-prerequisites: Requires this deployment's optional otp feature and its configured service/provider.
    /v1/otp/send:
        post:
            description: Generates a one-time passcode and dispatches it through SMS, WhatsApp, or email via the standard notification pipeline. Subject to standard per-channel credit billing.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/dto.OTPSendRequest'
                description: OTP send request
                required: true
                x-originalParamName: body
            responses:
                "202":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/dto.OTPSendResponse'
                    description: Accepted
                "400":
                    content:
                        application/json:
                            schema:
                                additionalProperties: true
                                type: object
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                additionalProperties: true
                                type: object
                    description: Unauthorized
                "409":
                    content:
                        application/json:
                            schema:
                                additionalProperties: true
                                type: object
                    description: Conflict
                "429":
                    content:
                        application/json:
                            schema:
                                additionalProperties: true
                                type: object
                    description: Too Many Requests
                "500":
                    content:
                        application/json:
                            schema:
                                additionalProperties: true
                                type: object
                    description: Internal Server Error
                "503":
                    content:
                        application/json:
                            schema:
                                additionalProperties: true
                                type: object
                    description: Service Unavailable
            security:
                - ApiKeyAuth: []
                - BearerAuth: []
            summary: Send an OTP
            tags:
                - OTP
            x-contract-example:
                request:
                    channel: email
                    recipient: alice@example.test
                    ttl_seconds: 300
                response:
                    channel: email
                    max_attempts: 5
                    notification_id: ${OTP_NOTIFICATION_ID}
                    request_id: ${OTP_REQUEST_ID}
            x-feature-prerequisites: Requires this deployment's optional otp feature and its configured service/provider.
    /v1/otp/verify:
        post:
            description: Verifies a code against a previously-issued request_id. Uses constant-time comparison and atomic attempt counting.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/dto.OTPVerifyRequest'
                description: OTP verify request
                required: true
                x-originalParamName: body
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/dto.OTPVerifyResponse'
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/dto.OTPVerifyResponse'
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                additionalProperties: true
                                type: object
                    description: Unauthorized
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/dto.OTPVerifyResponse'
                    description: Not Found
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/dto.OTPVerifyResponse'
                    description: Conflict
                "410":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/dto.OTPVerifyResponse'
                    description: Gone
                "503":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/dto.OTPVerifyResponse'
                    description: Service Unavailable
            security:
                - ApiKeyAuth: []
                - BearerAuth: []
            summary: Verify an OTP
            tags:
                - OTP
            x-contract-example:
                request:
                    code: WRONG_CODE
                    request_id: ${OTP_REQUEST_ID}
                response:
                    attempts_remaining: 4
                    error: invalid_code
                    request_id: ${OTP_REQUEST_ID}
                    verified: false
            x-feature-prerequisites: Requires this deployment's optional otp feature and its configured service/provider.
servers:
    - url: /
