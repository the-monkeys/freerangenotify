services:
  # OpenTelemetry Collector: receives OTLP from API/worker and exports to Tempo.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.130.0
    container_name: freerange-otel-collector
    restart: unless-stopped
    mem_limit: 256m
    environment:
      GOMEMLIMIT: 160MiB
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - type: bind
        source: ${FREERANGE_OTEL_CONFIG_DIR:-./config}/otel-collector.yaml
        target: /etc/otelcol/config.yaml
        read_only: true
        bind:
          create_host_path: false
    # OTLP is reachable only on the Compose network; no host publication.
    depends_on:
      - tempo
    networks:
      - freerange-network

  # Grafana Tempo: trace storage backend (no built-in UI).
  tempo:
    image: grafana/tempo:2.8.2
    container_name: freerange-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - type: bind
        source: ${FREERANGE_OTEL_CONFIG_DIR:-./config}/tempo.yaml
        target: /etc/tempo/tempo.yaml
        read_only: true
        bind:
          create_host_path: false
      - tempo_data:/var/tempo
    ports:
      - "127.0.0.1:${FREERANGE_TEMPO_PORT:-3200}:3200"
    networks:
      - freerange-network

  # Grafana UI for Tempo (separate from your app UI on 3000).
  grafana:
    image: grafana/grafana:12.0.0
    container_name: freerange-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${FREERANGE_GRAFANA_ADMIN_USER:-admin}
      # Preserve legacy provisioning; password rotation is an explicit operator action.
      - GF_SECURITY_ADMIN_PASSWORD=${FREERANGE_GRAFANA_ADMIN_PASSWORD:-admin}
      # disable anonymous by default; keep this behind your firewall anyway
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - type: bind
        source: ${FREERANGE_OTEL_CONFIG_DIR:-./config}/grafana-datasources.yaml
        target: /etc/grafana/provisioning/datasources/datasources.yaml
        read_only: true
        bind:
          create_host_path: false
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${FREERANGE_GRAFANA_PORT:-3002}:3000"
    depends_on:
      - tempo
    networks:
      - freerange-network

volumes:
  tempo_data:
  grafana_data:

networks:
  # Match base declarations when merged, or create a NEW standalone network.
  # Standalone attachment to any existing app network (even the same project)
  # uses the runbook's external override, which clears this driver declaration.
  freerange-network:
    driver: bridge

